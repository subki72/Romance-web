name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, Syntax & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci

      - name: Verify JavaScript syntax
        run: npm run verify:syntax

      - name: Run ESLint
        run: npm run lint

      - name: Run Automated Test Suite
        run: npm test

  security-and-container:
    name: Build, SAST & Container Security Scan
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/javascript

      - name: Build Hardened Docker Image
        run: docker build -t romance-web:ci .

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: romance-web:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
